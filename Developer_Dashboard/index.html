<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="dashboard">

        <header>
            <h1>Developer Dashboard</h1>
        </header>

        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Home</a>
                <a href="#">Profile</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main>

            <h2>My Skills</h2>

            <div class="skills">

                <div class="skill">
                    <h3>HTML</h3>
                    <p>Advanced</p>
                </div>

                <div class="skill">
                    <h3>CSS</h3>
                    <p>Intermediate</p>
                </div>

                <div class="skill">
                    <h3>JavaScript</h3>
                    <p>Intermediate</p>
                </div>

            </div>

            <section class="project">
                <h2>Recent Project</h2>
                <p>
                    A full-stack developer portfolio website.
                </p>

                <button>View Project</button>
            </section>

        </main>

        <footer>
            <p>Developer Dashboard 2026</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
