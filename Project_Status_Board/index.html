<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Status Board</title>
    <meta name="author" content="Ranim" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
     <h1>Devboard</h1>
       <img src="project_status_logo.png" height="auto" width="auto">
        <h1 class="name">Ranim</h1>
        
      
    </header>
    <main>
      <section class="projects">
        <h2>PROJECTS</h2>
        <p>Track your team's current work</p>

      </section>

      <section class="cards">
        <div class="card">
          <h2>Website Redesign</h2>
          <p>Sarah</p>
          <div class="bar b1">70%</div>
          <p>Active</p>
          <button>View Project</button>
        </div>
        <div class="card">
          <h2>Mobile App</h2>
          <p>Ahmad</p>
          <div class="bar b2">40%</div>
          <p>Planning</p>
          <button>View Project</button>
        </div>
        <div class="card">
          <h2>API development</h2>
          <p>Ranim</p>
          <div class="bar b3">85%</div>
          <p>Active</p>
          <button>View Project</button>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
